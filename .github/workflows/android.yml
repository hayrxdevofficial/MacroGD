name: Build MacroGD for Android

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Android ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]

    steps:
      - uses: actions/checkout@v7

      - name: Build Android mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          combine: true
          build-config: Release
          android-min-sdk: 23

  package:
    name: Package Android builds
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Combine Android packages
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload Android package
        uses: actions/upload-artifact@v7
        with:
          name: MacroGD-Android
          path: ${{ steps.combine.outputs.build-output }}
          if-no-files-found: error
